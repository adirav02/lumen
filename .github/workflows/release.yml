name: Release

on:
  push:
    tags: ['v*']
  # For retries, select an existing version tag in the Actions UI.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Require a version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reject branch dispatches
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag
          [[ "$REF_NAME" == v* ]]

  checks:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  release:
    name: Prepare validated draft GitHub Release
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: distributions
          path: dist

      - name: Verify downloaded distribution checksums
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      - name: Create draft pending release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --generate-notes --draft
